<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShareStory - Offline</title>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
        color: #333;
      }
      .offline-container {
        text-align: center;
        padding: 2rem;
        max-width: 500px;
      }
      .offline-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="offline-icon">
        <i class="fas fa-wifi-slash"></i>
      </div>
      <h1>You're Offline</h1>
      <p>
        Some features may be limited while offline. Your previously viewed content is still
        available.
      </p>
      <button onclick="window.location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
