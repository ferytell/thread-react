<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're Offline</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9fafb;
        color: #111827;
        text-align: center;
        padding: 2rem;
      }
      .offline-container {
        max-width: 500px;
        margin: auto;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }
      p {
        font-size: 1rem;
        color: #4b5563;
      }
      .icon {
        font-size: 4rem;
        color: #9ca3af;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="offline-container">
      <div class="icon">📴</div>
      <h1>You're Offline</h1>
      <p>Sorry, it looks like you're not connected to the internet.</p>
      <p>Please check your connection and try again later.</p>
    </div>
  </body>
</html>
